services:
  - type: web
    name: clientflow-staging
    runtime: python
    region: frankfurt
    plan: free
    branch: feature/deploy-39-staging
    buildCommand: bash render_build.sh
    startCommand: >-
      ./.venv/bin/flask db upgrade &&
      ./.venv/bin/gunicorn --chdir src wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 1
      --threads 4
      --timeout 120
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PIPENV_DONT_LOAD_ENV
        value: "1"
      - key: PIPENV_VENV_IN_PROJECT
        value: "1"
      - key: PIPENV_IGNORE_VIRTUALENVS
        value: "1"
      - key: FLASK_APP
        value: src/app.py
      - key: FLASK_DEBUG
        value: "0"
      - key: ENABLE_DEV_ADMIN
        value: "0"
      - key: AUTH_ALLOW_LOCAL_BOOTSTRAP
        value: "0"
      - key: VITE_BASENAME
        value: /
      - key: VITE_USE_MOCK_API
        value: "false"
      - key: FRONTEND_ORIGIN
        value: https://clientflow-staging.onrender.com
      - key: AUTH_RESET_URL
        value: https://clientflow-staging.onrender.com/reset-password
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PLAN_SEED_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: clientflow-staging-db
          property: connectionString

databases:
  - name: clientflow-staging-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
