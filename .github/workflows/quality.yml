name: Quality

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_TEST_DATABASE_URL: sqlite://
      PYTHONPATH: src:tests
      PYTHONDONTWRITEBYTECODE: '1'
      PIPENV_VENV_IN_PROJECT: '1'
      PIPENV_IGNORE_VIRTUALENVS: '1'
      PIPENV_DONT_LOAD_ENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Pipfile.lock
      - run: python -m pip install pipenv==2024.4.1
      - run: pipenv verify && pipenv sync
      - name: Check Python syntax and indentation
        run: |
          pipenv run python -m compileall -q src tests
          pipenv run python -m tabnanny src tests
      - name: Run backend tests with an isolated database
        run: pipenv run python -m unittest discover -s tests -p 'test_*.py' -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  formatting:
    name: Patch formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check added lines for whitespace errors
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Check commit whitespace
        if: github.event_name != 'pull_request'
        run: git show --format= --check HEAD
